name: Tests

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: [17, 21]
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v6
        with:
          java-version: ${{ matrix.java }}
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Run tests
        # 2026-11-05 09:02 +03: tests read the test number from this secret and skip when unset. Task: int-testnumber
        env:
          KWTSMS_TEST_NUMBER: ${{ secrets.KWTSMS_TEST_NUMBER }}
        run: ./gradlew test

      - name: Run integration tests
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          JAVA_USERNAME: ${{ secrets.JAVA_USERNAME }}
          JAVA_PASSWORD: ${{ secrets.JAVA_PASSWORD }}
          # 2026-11-05 09:02 +03: live sends go only to this number; skipped when unset. Task: int-testnumber
          KWTSMS_TEST_NUMBER: ${{ secrets.KWTSMS_TEST_NUMBER }}
        run: ./gradlew test
